<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Sapat transcript knowledge base workflow</title>
  <desc id="desc">A five step workflow from recordings to Sapat, raw transcripts, structured notes, and a searchable knowledge base.</desc>
  <rect width="1200" height="520" fill="#f7f9fc"/>
  <rect x="52" y="56" width="1096" height="408" rx="18" fill="#ffffff" stroke="#d7deea" stroke-width="2"/>
  <text x="94" y="116" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#111827">Sapat to Knowledge Base in Daytona</text>
  <text x="94" y="154" font-family="Arial, sans-serif" font-size="18" fill="#4b5563">Keep raw transcripts immutable, then edit structured Markdown notes for review and handoff.</text>

  <g font-family="Arial, sans-serif">
    <rect x="94" y="226" width="160" height="132" rx="12" fill="#e8f2ff" stroke="#7aa7e6" stroke-width="2"/>
    <text x="174" y="268" text-anchor="middle" font-size="21" font-weight="700" fill="#0f3b72">Recordings</text>
    <text x="174" y="300" text-anchor="middle" font-size="15" fill="#24476f">demo.mp4</text>
    <text x="174" y="324" text-anchor="middle" font-size="15" fill="#24476f">review.mp4</text>

    <path d="M270 292 H346" stroke="#64748b" stroke-width="3" fill="none"/>
    <path d="M346 292 l-12 -8 v16 z" fill="#64748b"/>

    <rect x="366" y="226" width="160" height="132" rx="12" fill="#effdf3" stroke="#73bf89" stroke-width="2"/>
    <text x="446" y="268" text-anchor="middle" font-size="21" font-weight="700" fill="#1f6a38">Sapat</text>
    <text x="446" y="300" text-anchor="middle" font-size="15" fill="#2f6b42">ffmpeg</text>
    <text x="446" y="324" text-anchor="middle" font-size="15" fill="#2f6b42">OpenAI/Groq/Azure</text>

    <path d="M542 292 H618" stroke="#64748b" stroke-width="3" fill="none"/>
    <path d="M618 292 l-12 -8 v16 z" fill="#64748b"/>

    <rect x="638" y="226" width="160" height="132" rx="12" fill="#fff7e6" stroke="#dda94f" stroke-width="2"/>
    <text x="718" y="268" text-anchor="middle" font-size="21" font-weight="700" fill="#855c00">Raw Text</text>
    <text x="718" y="300" text-anchor="middle" font-size="15" fill="#755a1a">transcript.txt</text>
    <text x="718" y="324" text-anchor="middle" font-size="15" fill="#755a1a">corrected.txt</text>

    <path d="M814 292 H890" stroke="#64748b" stroke-width="3" fill="none"/>
    <path d="M890 292 l-12 -8 v16 z" fill="#64748b"/>

    <rect x="910" y="226" width="196" height="132" rx="12" fill="#f1efff" stroke="#9b8be6" stroke-width="2"/>
    <text x="1008" y="268" text-anchor="middle" font-size="21" font-weight="700" fill="#4c3a8f">Knowledge Base</text>
    <text x="1008" y="300" text-anchor="middle" font-size="15" fill="#5b4f8a">summary</text>
    <text x="1008" y="324" text-anchor="middle" font-size="15" fill="#5b4f8a">decisions</text>
  </g>

  <g font-family="Arial, sans-serif" font-size="16" fill="#374151">
    <text x="94" y="400">1. Put recordings in a reproducible Daytona workspace.</text>
    <text x="94" y="428">2. Run Sapat with an explicit provider and prompt.</text>
    <text x="594" y="400">3. Preserve raw output before editing.</text>
    <text x="594" y="428">4. Publish reviewed Markdown notes with traceable source links.</text>
  </g>
</svg>
